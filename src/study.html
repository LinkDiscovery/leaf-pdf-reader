<nav class="study-navigation" aria-label="읽기와 학습">
  <div role="tablist" aria-label="학습 공간">
    <button id="tab-reader" role="tab" aria-selected="true" aria-controls="reader-panel" data-view="reader">PDF 읽기</button>
    <button id="tab-words" role="tab" aria-selected="false" aria-controls="study-panel" tabindex="-1" data-view="word">나의 단어장</button>
    <button id="tab-sentences" role="tab" aria-selected="false" aria-controls="study-panel" tabindex="-1" data-view="sentence">나의 문장</button>
  </div>
  <div class="display-controls"><label for="ui-font-size">화면 글자</label><select id="ui-font-size" title="메뉴·설명·학습 카드의 글자 크기"><option value="16">기본</option><option value="18">크게</option><option value="20">아주 크게</option></select><button id="help-open" class="button secondary">사용법</button></div>
  <div class="study-account"><label class="click-effect-option" title="클릭한 위치에 작은 원을 잠깐 표시합니다"><input id="click-effect-toggle" type="checkbox" checked> 클릭 효과</label><span id="study-sync" role="status">학습 기록 준비 중…</span><button id="study-login" class="text-button" hidden>Google 로그인</button><button id="study-logout" class="text-button" hidden>로그아웃</button><a id="study-setup" href="https://github.com/LinkDiscovery/leaf-pdf-reader/blob/main/docs/firebase-setup.md" target="_blank" rel="noopener noreferrer" hidden>동기화 설정 안내 ↗</a></div>
</nav>
<section id="study-panel" class="study-panel" role="tabpanel" aria-labelledby="tab-words" hidden>
  <div class="study-heading"><div><div class="eyebrow">MY READING COLLECTION</div><h1 id="study-title">나의 단어장</h1><p id="study-description">읽다가 만난 단어를, 내 표현으로 기억하세요.</p></div><button id="study-add" class="button primary" disabled>＋ 직접 추가</button></div>
  <div class="study-controls"><label class="study-search"><span class="sr-only">학습 기록 검색</span><input id="study-search" type="search" placeholder="단어, 뜻, 예문, 출처 검색" maxlength="200"></label><label><span class="sr-only">복습 상태</span><select id="study-filter"><option value="all">전체</option><option value="learning">학습 중</option><option value="learned">외웠어요</option></select></label><label class="study-review"><input id="study-hide" type="checkbox"> 뜻·번역 가리고 복습</label></div>
  <div class="study-summary"><span id="study-count" aria-live="polite"></span><div><button id="study-export" class="text-button" disabled>백업 내보내기</button><button id="study-import" class="text-button" disabled>백업 가져오기</button><button id="study-migrate" class="text-button" hidden>기기 기록 가져오기</button></div></div>
  <p id="study-error" role="alert" hidden></p>
  <div id="study-list" class="study-list"></div>
  <div id="study-empty" class="study-empty" hidden><span aria-hidden="true">✧</span><h2>아직 모아 둔 기록이 없어요</h2><p>사전의 저장 버튼을 누르거나 직접 추가해 보세요.</p></div>
  <button id="study-more" class="button secondary" hidden>더 보기</button>
  <p class="study-footnote">PDF 파일과 PDF 형광펜·메모는 동기화하지 않습니다. 로그인하면 저장한 단어와 문장, 그 출처만 내 계정에 동기화됩니다.</p>
  <input id="study-import-file" type="file" accept=".json,application/json" hidden>
</section>
<dialog id="study-editor" aria-labelledby="study-editor-title">
  <form id="study-form">
    <div class="note-dialog-heading"><h2 id="study-editor-title">단어 저장</h2><button id="study-cancel" type="button" class="icon-button" aria-label="학습 기록 닫기">×</button></div>
    <p id="study-editor-storage" class="muted"></p>
    <label for="study-text" id="study-text-label">단어</label><textarea id="study-text" maxlength="4000" rows="2" required></textarea>
    <p id="study-duplicate" class="muted" hidden>같은 표현이 이미 있어요. 다른 뜻이나 예문이면 새 항목으로 저장할 수 있어요.</p>
    <div id="study-word-fields"><label for="study-english">영어 뜻</label><textarea id="study-english" maxlength="4000" rows="2"></textarea><label for="study-example">예시문장</label><textarea id="study-example" maxlength="4000" rows="2"></textarea></div>
    <label for="study-korean" id="study-korean-label">한국어 뜻</label><textarea id="study-korean" maxlength="4000" rows="2"></textarea>
    <label for="study-note">내 메모 <span class="muted">선택</span></label><textarea id="study-note" maxlength="4000" rows="2"></textarea>
    <div class="study-source-fields"><label>출처<input id="study-source" maxlength="500" placeholder="책 또는 PDF 이름"></label><label>페이지<input id="study-page" type="number" min="0" max="1000000" step="1" value="0"></label></div>
    <p id="study-form-error" role="alert" hidden></p>
    <div class="note-dialog-actions"><button id="study-dismiss" type="button" class="button secondary">취소</button><button id="study-submit" type="submit" class="button primary">저장</button></div>
  </form>
</dialog>
<dialog id="study-delete-dialog" aria-labelledby="study-delete-title"><form method="dialog"><h2 id="study-delete-title">이 학습 기록을 삭제할까요?</h2><p>로그인 상태라면 다른 기기에서도 삭제됩니다.</p><div class="note-dialog-actions"><button value="cancel" class="button secondary">취소</button><button value="delete" class="button primary">삭제</button></div></form></dialog>
